name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        datenbank: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akte
          POSTGRES_PASSWORD: nur-fuer-die-ci
          POSTGRES_DB: akte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akte" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AKTE_DATEN: /tmp/akte-daten
      DATABASE_URL: ${{ matrix.datenbank == 'postgres' && 'postgres://akte:nur-fuer-die-ci@localhost:5432/akte' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r backend/requirements-browser.txt ./beweis
      - run: python -m playwright install --with-deps chromium
      - name: Migrationen vollständig
        working-directory: backend
        run: DJANGO_DEBUG=1 python manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: backend
        run: python manage.py test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  mcp-und-beweis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt -e "./beweis[test]" -e "./mcp[test]"
      - name: Atlas-Prüfer für die Kreuzprüfung
        working-directory: beweis/kreuzpruefung
        run: npm ci
      - name: Beweis (Atlas-Pins, Kreuzprüfung)
        working-directory: beweis
        run: pytest -q
      - name: MCP (mit echtem Backend)
        working-directory: mcp
        env:
          AKTE_BACKEND_PYTHON: python
        run: pytest -q
      - name: Leckschutz-Prüfer (eigene Tests)
        run: pytest -q werkzeuge/scrub

  # Die Starter laufen mit Attrappen für docker, claude und uvx (kein Docker, kein Internet nötig). Geprüft werden die
  # Pfade, an denen Anfänger in 0.1.0 hängen blieben: Start aus der ZIP, Docker fehlt oder startet nicht, Port belegt,
  # Bau scheitert, erstes Konto, Agent verbinden, dazu status -Json für Agenten und alle .cmd-Dateien (CRLF,
  # ungeschützte Klammern in echo innerhalb von Blöcken). Außerdem: Der Einrichtungscode steht in keiner Ausgabe, die
  # ein Agent liest (nur im Browser-Fragment #code=…), verschwindet nach der Einrichtung aus .env, und eine Akte mit
  # Daten bekommt keinen neuen.
  starter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Starter prüfen (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\starter-pruefen.ps1

  starter-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning start/akte.sh start/start-akte.command start/stop-akte.command .github/scripts/starter-pruefen.sh .github/scripts/hostfilter-pruefen.sh
      - name: Starter prüfen
        run: bash .github/scripts/starter-pruefen.sh
      - name: Starter im Repo ausführbar (Doppelklick am Mac, ./start/… unter Linux)
        run: |
          for f in start/akte.sh start/start-akte.command start/stop-akte.command; do
            if ! git ls-files -s -- "$f" | grep -q '^100755'; then
              echo "::error file=$f::nicht ausführbar – git update-index --chmod=+x $f"
              exit 1
            fi
          done

  # Dieselbe Prüfung auf einem Mac (Apple Silicon). Die Starter laufen dort mit /bin/bash 3.2 wie beim Doppelklick
  # auf start-akte.command und mit den BSD-Werkzeugen von macOS (sed, grep, stat, tr), das Prüfskript mit der neueren
  # Bash des Runners.
  starter-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Starter prüfen (Starter mit /bin/bash 3.2)
        shell: bash
        run: |
          /bin/bash --version | sed -n 1p
          neue_bash="$(command -v bash)"
          if ! "$neue_bash" -c '[ "${BASH_VERSINFO[0]}" -ge 4 ]'; then
            brew install bash
            neue_bash="$(brew --prefix)/bin/bash"
          fi
          "$neue_bash" --version | sed -n 1p
          STARTER_BASH=/bin/bash "$neue_bash" .github/scripts/starter-pruefen.sh

  # Baut und startet die ganze Akte in Docker (nur hier, nie lokal nötig) und prüft den Host-Filter des Eingangs:
  # bekannte Namen 200, fremde 421 (Schutz gegen DNS-Rebinding), auch mit eigener Domain aus der Umgebung.
  stack-hostfilter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: .env für den Testlauf
        run: |
          cp .env.example .env
          geheim="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          sed -i "s/^DJANGO_SECRET_KEY=$/DJANGO_SECRET_KEY=${geheim}/" .env
          grep -q '^DJANGO_SECRET_KEY=.\{50,\}$' .env
      - name: Akte bauen und starten
        run: docker compose up -d --build --wait
      - name: Host-Filter prüfen
        run: bash .github/scripts/hostfilter-pruefen.sh
      - name: Protokolle, falls etwas scheitert
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Aufräumen
        if: always()
        run: docker compose down -v

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: node --check render/render_fahrt.cjs && node --check render/render_dienst.cjs
      - run: python -m py_compile render/aufnahme.py render/vertonen.py render/mischen.py werkzeuge/fotos_suchen.py
