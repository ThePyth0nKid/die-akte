# Backend-Tests auch mit pytest (pytest-django, siehe requirements-dev.txt): cd backend && python -m pytest -q
# Gleichwertig zu „python manage.py test“ (so läuft die CI). Die Test-Einstellungen setzen AKTE_TESTLAUF=1 selbst.
[pytest]
DJANGO_SETTINGS_MODULE = aktesite.settings_pytest
testpaths = akte/tests konto/tests
python_files = test_*.py
addopts = -p no:cacheprovider
# whitenoise meldet den (im Test nie gebauten) Ordner staticfiles/ bei jeder Anfrage
filterwarnings = ignore:No directory at:UserWarning
