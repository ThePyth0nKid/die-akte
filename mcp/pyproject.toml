[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "akte-mcp"
version = "0.1.0"
description = "MCP-Server, Client und CLI für Die Akte – Ermittler-Wand mit Belegpflicht"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12,<2",
  "requests>=2.33",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Signaturen prüfen (akte pruefe-signaturen): das Paket akte-beweis aus demselben Repo.
beweis = ["akte-beweis @ git+https://github.com/ThePyth0nKid/die-akte#subdirectory=beweis"]
test = ["pytest>=8", "responses>=0.25"]

[project.scripts]
akte = "akte_client.cli:main"
akte-mcp = "akte_mcp.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/akte_client", "src/akte_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: startet ein echtes Backend (braucht die Backend-Abhängigkeiten)"]
